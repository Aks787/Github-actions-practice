# Workflows
#It gives name to the Workflows, although its not necessary if its omitted, Github uses its workflow file name
name: Checkout Code

#it defines when the workflows should run
on:
  pull_request:

# A jobs is a collection of steps executed on a runner
jobs:
  checkout:
    runs-on: ubuntu-latest  #
    #Individual tasks inside a jobs
    steps:
      - uses: actions/checkout@v4 #executes a resusable acions
      # Executes a command shell
      - run: pwd 
      - run: ls
      
    
